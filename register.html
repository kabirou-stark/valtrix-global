<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#05070b">

<title>VALTRIX Global™ — Créer un compte</title>

<meta
  name="description"
  content="Créez votre compte VALTRIX Global™."
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 25%,
      #061426 0%,
      #030914 42%,
      #000000 78%
    );

  color:#f4f7fb;
  min-height:100vh;
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  min-height:100vh;

  display:flex;
  flex-direction:column;

  align-items:center;

  padding:
    58px
    20px
    35px;
}

/* =========================================================
   LOGO
========================================================= */

.logo{
  display:flex;
  align-items:center;
  gap:13px;

  margin-bottom:34px;
}

.logo-icon{
  width:52px;
  height:52px;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      145deg,
      #147cff,
      #0054d9
    );

  color:white;

  font-size:25px;
  font-weight:900;

  box-shadow:
    0 10px 30px
    rgba(0,102,255,.25);
}

.logo-text{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.4px;
}

.logo-text span{
  color:#2f8cff;
}

/* =========================================================
   CARD
========================================================= */

.register-card{
  width:100%;
  max-width:470px;

  background:
    linear-gradient(
      145deg,
      rgba(8,14,24,.96),
      rgba(3,7,13,.98)
    );

  border:
    1px solid
    rgba(47,140,255,.20);

  border-radius:24px;

  padding:30px 24px 27px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.45);
}

/* =========================================================
   HEADER
========================================================= */

.register-title{
  text-align:center;

  font-size:28px;
  font-weight:900;

  letter-spacing:-.7px;

  margin-bottom:9px;
}

.register-subtitle{
  text-align:center;

  color:#8995a7;

  font-size:13px;

  line-height:1.55;

  margin-bottom:27px;
}

/* =========================================================
   FORM
========================================================= */

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;

  color:#dce4ef;

  font-size:12px;
  font-weight:650;

  margin:
    0
    0
    8px
    1px;
}

.form-group input{
  width:100%;

  height:55px;

  border:1px solid
    rgba(255,255,255,.09);

  border-radius:13px;

  background:
    #080d15;

  color:#f2f6fb;

  outline:none;

  padding:
    0
    16px;

  font-size:14px;

  transition:
    border-color .2s,
    box-shadow .2s;
}

.form-group input::placeholder{
  color:#667386;
}

.form-group input:focus{
  border-color:
    rgba(47,140,255,.65);

  box-shadow:
    0 0 0 3px
    rgba(47,140,255,.08);
}

/* =========================================================
   REFERRAL
========================================================= */

.referral-group{
  position:relative;
}

.referral-label-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.referral-optional{
  color:#647286;
  font-size:10px;
  font-weight:500;
}

.referral-input{
  text-transform:uppercase;
  letter-spacing:.6px;
}

/* =========================================================
   PASSWORD
========================================================= */

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.password-toggle{
  position:absolute;

  right:10px;
  top:50%;

  transform:translateY(-50%);

  width:38px;
  height:38px;

  border:0;

  border-radius:9px;

  background:
    rgba(255,255,255,.04);

  color:#8290a4;

  font-size:15px;
}

.password-toggle:hover{
  color:#fff;
  background:
    rgba(255,255,255,.07);
}

/* =========================================================
   CHECKBOX
========================================================= */

.terms{
  display:flex;
  align-items:flex-start;

  gap:9px;

  margin:
    4px
    0
    20px;
}

.terms input{
  width:16px;
  height:16px;

  margin-top:2px;

  accent-color:#1677ff;

  flex:none;
}

.terms label{
  color:#78869a;

  font-size:10px;

  line-height:1.5;
}

.terms a{
  color:#4b9cff;
}

/* =========================================================
   BUTTON
========================================================= */

.register-button{
  width:100%;

  height:55px;

  border:0;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #1677ff,
      #0758e8
    );

  color:#fff;

  font-size:13px;
  font-weight:800;

  box-shadow:
    0 10px 30px
    rgba(0,91,255,.20);

  transition:
    transform .15s,
    opacity .15s,
    box-shadow .15s;
}

.register-button:hover{
  box-shadow:
    0 14px 35px
    rgba(0,91,255,.28);
}

.register-button:active{
  transform:scale(.99);
}

.register-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:none;

  margin-top:14px;

  padding:12px 13px;

  border-radius:11px;

  font-size:11px;

  line-height:1.45;

  text-align:center;
}

.message.error{
  display:block;

  color:#ff9292;

  background:
    rgba(255,61,61,.08);

  border:
    1px solid
    rgba(255,61,61,.16);
}

.message.success{
  display:block;

  color:#55df91;

  background:
    rgba(53,208,127,.07);

  border:
    1px solid
    rgba(53,208,127,.15);
}

/* =========================================================
   LOGIN
========================================================= */

.login-text{
  text-align:center;

  color:#78869a;

  font-size:11px;

  margin-top:23px;
}

.login-text a{
  color:#4b9cff;
  font-weight:700;
}

/* =========================================================
   BACK
========================================================= */

.back{
  text-align:center;

  margin-top:25px;

  color:#687589;

  font-size:10px;
}

.back:hover{
  color:#aeb9c8;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  margin-top:27px;

  color:#4f5b6b;

  font-size:9px;

  text-align:center;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  display:none;

  align-items:center;
  justify-content:center;

  gap:8px;
}

.spinner{
  width:14px;
  height:14px;

  border:
    2px solid
    rgba(255,255,255,.25);

  border-top-color:#fff;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

  .page{
    padding:
      42px
      20px
      30px;
  }

  .logo{
    margin-bottom:30px;
  }

  .logo-icon{
    width:50px;
    height:50px;
  }

  .logo-text{
    font-size:20px;
  }

  .register-card{
    padding:
      27px
      20px
      24px;

    border-radius:22px;
  }

  .register-title{
    font-size:26px;
  }

}

@media(max-width:360px){

  .page{
    padding-left:15px;
    padding-right:15px;
  }

  .register-card{
    padding-left:17px;
    padding-right:17px;
  }

}
</style>
</head>

<body>

<div class="page">

  <!-- LOGO -->

  <div class="logo">

    <div class="logo-icon">
      V
    </div>

    <div class="logo-text">
      VALTRIX <span>GLOBAL™</span>
    </div>

  </div>


  <!-- REGISTER CARD -->

  <div class="register-card">

    <h1 class="register-title">
      Créer un compte.
    </h1>

    <p class="register-subtitle">
      Créez votre espace personnel VALTRIX Global™
      et commencez votre expérience.
    </p>


    <!-- NOM -->

    <div class="form-group">

      <label for="fullName">
        Nom complet
      </label>

      <input
        id="fullName"
        type="text"
        autocomplete="name"
        placeholder="Votre nom complet"
      >

    </div>


    <!-- EMAIL -->

    <div class="form-group">

      <label for="email">
        Adresse e-mail
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Votre adresse e-mail"
      >

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

      <label for="password">
        Mot de passe
      </label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="Créez votre mot de passe"
        >

        <button
          type="button"
          class="password-toggle"
          id="passwordToggle"
          aria-label="Afficher le mot de passe"
        >
          ◉
        </button>

      </div>

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="form-group">

      <label for="confirmPassword">
        Confirmer le mot de passe
      </label>

      <div class="password-wrap">

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Confirmez votre mot de passe"
        >

        <button
          type="button"
          class="password-toggle"
          id="confirmPasswordToggle"
          aria-label="Afficher le mot de passe"
        >
          ◉
        </button>

      </div>

    </div>


    <!-- REFERRAL -->

    <div class="form-group referral-group">

      <div class="referral-label-row">

        <label for="referralCode">
          Code de parrainage
        </label>

        <span class="referral-optional">
          Facultatif
        </span>

      </div>

      <input
        id="referralCode"
        class="referral-input"
        type="text"
        autocomplete="off"
        placeholder="Code de parrainage"
      >

    </div>


    <!-- TERMS -->

    <div class="terms">

      <input
        id="terms"
        type="checkbox"
      >

      <label for="terms">
        J'accepte les conditions d'utilisation
        de VALTRIX Global™.
      </label>

    </div>


    <!-- BUTTON -->

    <button
      type="button"
      class="register-button"
      id="registerButton"
    >

      <span id="buttonText">
        Créer un compte →
      </span>

      <span
        class="loading"
        id="buttonLoading"
      >
        <span class="spinner"></span>
        Création...
      </span>

    </button>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- LOGIN -->

    <div class="login-text">

      Vous avez déjà un compte ?
      <a href="./login.html">
        Se connecter
      </a>

    </div>

  </div>


  <!-- BACK -->

  <a
    href="./index.html"
    class="back"
  >
    ← Retour à VALTRIX Global
  </a>


  <!-- FOOTER -->

  <footer>
    Plateforme VALTRIX Global™
  </footer>

</div>


<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://rokpuhcfetfwyozkcinr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_A7LXLgFE0b9UrFMOHX6LRw_D2PhFRrN";

let supabaseClient = null;


/* =========================================================
   INITIALISATION
========================================================= */

function initializeSupabase(){

  if(
    typeof window.supabase ===
    "undefined"
  ){

    throw new Error(
      "Supabase n'a pas pu être chargé."
    );

  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

}


/* =========================================================
   REFERRAL URL
========================================================= */

function getReferralCodeFromURL(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const ref =
      params.get("ref");

    if(!ref){
      return "";
    }

    return ref
      .trim()
      .toUpperCase();

  }catch(error){

    console.warn(
      "Impossible de récupérer le referral:",
      error
    );

    return "";

  }

}


/* =========================================================
   REFERRAL INPUT
========================================================= */

function initializeReferral(){

  const referralInput =
    document.getElementById(
      "referralCode"
    );

  if(!referralInput){
    return;
  }

  const referralCode =
    getReferralCodeFromURL();

  if(referralCode){

    referralInput.value =
      referralCode;

    referralInput.readOnly =
      true;

    referralInput.style.opacity =
      "0.85";

  }

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

function setupPasswordToggle(
  buttonId,
  inputId
){

  const button =
    document.getElementById(
      buttonId
    );

  const input =
    document.getElementById(
      inputId
    );

  if(!button || !input){
    return;
  }

  button.addEventListener(
    "click",
    ()=>{

      const visible =
        input.type === "text";

      input.type =
        visible
          ? "password"
          : "text";

      button.textContent =
        visible
          ? "◉"
          : "○";

    }
  );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type="error"
){

  const message =
    document.getElementById(
      "message"
    );

  if(!message){
    return;
  }

  message.className =
    "message " + type;

  message.textContent =
    text;

}


/* =========================================================
   BUTTON LOADING
========================================================= */

function setLoading(
  loading
){

  const button =
    document.getElementById(
      "registerButton"
    );

  const text =
    document.getElementById(
      "buttonText"
    );

  const loader =
    document.getElementById(
      "buttonLoading"
    );

  if(button){
    button.disabled =
      loading;
  }

  if(text){
    text.style.display =
      loading
        ? "none"
        : "inline";
  }

  if(loader){

    loader.style.display =
      loading
        ? "flex"
        : "none";

  }

}


/* =========================================================
   VALIDATION
========================================================= */

function validateForm(){

  const fullName =
    document.getElementById(
      "fullName"
    )?.value.trim();

  const email =
    document.getElementById(
      "email"
    )?.value.trim();

  const password =
    document.getElementById(
      "password"
    )?.value || "";

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    )?.value || "";

  const terms =
    document.getElementById(
      "terms"
    )?.checked;

  if(!fullName){

    showMessage(
      "Veuillez entrer votre nom complet."
    );

    return null;
  }

  if(fullName.length < 2){

    showMessage(
      "Votre nom doit contenir au moins 2 caractères."
    );

    return null;
  }

  if(!email){

    showMessage(
      "Veuillez entrer votre adresse e-mail."
    );

    return null;
  }

  if(!email.includes("@")){

    showMessage(
      "Veuillez entrer une adresse e-mail valide."
    );

    return null;
  }

  if(password.length < 6){

    showMessage(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return null;
  }

  if(password !== confirmPassword){

    showMessage(
      "Les deux mots de passe ne correspondent pas."
    );

    return null;
  }

  if(!terms){

    showMessage(
      "Veuillez accepter les conditions d'utilisation."
    );

    return null;
  }

  const referralCode =
    document.getElementById(
      "referralCode"
    )?.value
      .trim()
      .toUpperCase() || "";

  return {
    fullName,
    email,
    password,
    referralCode
  };

}


/* =========================================================
   REGISTER
========================================================= */

async function register(){

  if(!supabaseClient){

    showMessage(
      "Le système d'inscription n'est pas disponible."
    );

    return;
  }

  const form =
    validateForm();

  if(!form){
    return;
  }

  setLoading(true);

  const {
    fullName,
    email,
    password,
    referralCode
  } = form;

  try{

    /*
      Le code de parrainage est envoyé
      dans les métadonnées du nouvel utilisateur.

      Le backend pourra ensuite créer
      automatiquement la relation de parrainage.
    */

    const redirectURL =
      new URL(
        "./login.html",
        window.location.href
      ).toString();

    const result =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{

          data:{
            full_name:fullName,
            referral_code:
              referralCode || null
          },

          emailRedirectTo:
            redirectURL

        }

      });

    if(result.error){

      console.error(
        "Erreur Supabase:",
        result.error
      );

      const errorMessage =
        String(
          result.error.message || ""
        );

      if(
        errorMessage
          .toLowerCase()
          .includes("already registered")
      ){

        throw new Error(
          "Cette adresse e-mail possède déjà un compte."
        );

      }

      if(
        errorMessage
          .toLowerCase()
          .includes("password")
      ){

        throw new Error(
          "Le mot de passe n'est pas valide."
        );

      }

      throw new Error(
        result.error.message ||
        "Impossible de créer le compte."
      );

    }


    /*
      Si Supabase renvoie une session,
      l'utilisateur peut être connecté immédiatement.
    */

    if(result.data?.session){

      showMessage(
        "Compte créé avec succès. Redirection...",
        "success"
      );

      setTimeout(()=>{
        window.location.replace(
          "./dashboard.html"
        );
      },900);

      return;

    }


    /*
      Si la confirmation e-mail est activée
      dans Supabase, il faut confirmer l'adresse.
    */

    showMessage(
      "Compte créé avec succès. Vérifiez votre adresse e-mail pour confirmer votre compte.",
      "success"
    );

    setTimeout(()=>{

      window.location.replace(
        "./login.html"
      );

    },2500);


  }catch(error){

    console.error(
      "Erreur inscription:",
      error
    );

    showMessage(
      error?.message ||
      "Une erreur est survenue pendant la création du compte."
    );

  }finally{

    setLoading(false);

  }

}


/* =========================================================
   EVENTS
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    try{

      initializeSupabase();

      initializeReferral();

      setupPasswordToggle(
        "passwordToggle",
        "password"
      );

      setupPasswordToggle(
        "confirmPasswordToggle",
        "confirmPassword"
      );

      const button =
        document.getElementById(
          "registerButton"
        );

      if(button){

        button.addEventListener(
          "click",
          register
        );

      }

    }catch(error){

      console.error(
        "Initialisation:",
        error
      );

      showMessage(
        error?.message ||
        "Impossible d'initialiser la page."
      );

    }

  }
);


/* =========================================================
   ENTER
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      document.activeElement?.tagName !== "BUTTON"
    ){

      register();

    }

  }
);

</script>

</body>
</html>
