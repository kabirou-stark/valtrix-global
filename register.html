<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer un compte — VALTRIX Global™</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #000000;
      --blue: #0066ff;
      --blue-light: #1683ff;
      --white: #ffffff;
      --gray: #8d99aa;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 80% 15%,
          rgba(0, 102, 255, .18),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 80%,
          rgba(0, 60, 255, .12),
          transparent 30%
        ),
        #000;
    }

    .page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 14px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #0066ff,
          #003cff
        );

      box-shadow:
        0 0 35px
        rgba(0, 102, 255, .4);

      font-size: 23px;
      font-weight: 900;
    }

    .brand h1 {
      font-size: 23px;
      margin-bottom: 6px;
    }

    .brand h1 span {
      color: #1683ff;
    }

    .brand p {
      color: #788394;
      font-size: 13px;
    }

    .card {
      padding: 32px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(10, 16, 27, .96),
          rgba(2, 4, 8, .98)
        );

      border:
        1px solid
        rgba(0, 102, 255, .20);

      box-shadow:
        0 25px 80px
        rgba(0, 0, 0, .55);
    }

    .card h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #778394;
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #c4ccd7;

      font-size: 12px;
      font-weight: 650;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 11px;

      outline: none;

      border:
        1px solid
        rgba(255, 255, 255, .09);

      background:
        rgba(255, 255, 255, .035);

      color: white;

      font-size: 14px;

      transition: .25s;
    }

    input::placeholder {
      color: #566171;
    }

    input:focus {
      border-color:
        rgba(0, 102, 255, .7);

      box-shadow:
        0 0 0 3px
        rgba(0, 102, 255, .08);
    }

    .password-info {
      color: #5f6d7e;

      font-size: 10px;

      margin-top: 7px;
    }

    .terms {
      display: flex;
      gap: 9px;

      margin: 20px 0;

      color: #7b8797;

      font-size: 11px;

      line-height: 1.5;
    }

    .terms input {
      width: 15px;
      height: 15px;

      margin-top: 2px;

      accent-color: #0066ff;
    }

    .terms a {
      color: #1683ff;
    }

    .submit {
      width: 100%;

      border: none;

      padding: 15px;

      border-radius: 12px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #0066ff,
          #003cff
        );

      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 12px 30px
        rgba(0, 102, 255, .22);

      transition: .3s;
    }

    .submit:hover {
      transform: translateY(-2px);

      box-shadow:
        0 17px 40px
        rgba(0, 102, 255, .35);
    }

    .login {
      text-align: center;

      margin-top: 23px;

      color: #737f90;

      font-size: 12px;
    }

    .login a {
      color: #1683ff;
      font-weight: 700;
    }

    .security {
      margin-top: 18px;

      text-align: center;

      color: #566171;

      font-size: 10px;
    }

    @media (max-width: 500px) {

      .card {
        padding: 25px 20px;
      }

      .page {
        padding: 20px 14px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="container">

      <div class="brand">

        <div class="logo">
          V
        </div>

        <h1>
          VALTRIX
          <span>GLOBAL™</span>
        </h1>

        <p>
          Digital Asset Platform
        </p>

      </div>


      <section class="card">

        <h2>
          Créer un compte
        </h2>

        <p class="subtitle">
          Rejoignez VALTRIX Global™ et accédez
          à votre espace personnel.
        </p>


        <form>

          <div class="form-group">

            <label for="name">
              Nom complet
            </label>

            <input
              id="name"
              type="text"
              placeholder="Votre nom complet"
              required
            >

          </div>


          <div class="form-group">

            <label for="email">
              Adresse e-mail
            </label>

            <input
              id="email"
              type="email"
              placeholder="vous@example.com"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              Mot de passe
            </label>

            <input
              id="password"
              type="password"
              placeholder="Créer un mot de passe"
              required
            >

            <div class="password-info">
              Utilisez un mot de passe suffisamment sécurisé.
            </div>

          </div>


          <div class="form-group">

            <label for="confirm">
              Confirmer le mot de passe
            </label>

            <input
              id="confirm"
              type="password"
              placeholder="Confirmer votre mot de passe"
              required
            >

          </div>


          <div class="terms">

            <input
              type="checkbox"
              id="terms"
              required
            >

            <label for="terms">

              J'accepte les
              <a href="#">
                conditions d'utilisation
              </a>
              et la
              <a href="#">
                politique de confidentialité
              </a>.

            </label>

          </div>


          <button
            type="submit"
            class="submit"
          >
            Créer mon compte →
          </button>

        </form>


        <div class="login">

          Vous avez déjà un compte ?

          <a href="login.html">
            Se connecter
          </a>

        </div>

      </section>


      <div class="security">
        🔐 Connexion sécurisée • VALTRIX Global™
      </div>

    </div>

  </main>

</body>
</html>
