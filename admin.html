<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070c">

<title>VALTRIX Global™ — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#05070c;
  --bg2:#080c14;
  --card:#0c111b;
  --card2:#101722;
  --border:rgba(255,255,255,.07);
  --blue:#247cff;
  --cyan:#20d9ff;
  --green:#35d07f;
  --red:#ff5364;
  --gold:#f0b94d;
  --text:#f4f7fb;
  --muted:#8995a8;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(36,124,255,.13),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(32,217,255,.06),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* TOPBAR */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  min-height:68px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(5,7,12,.95);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#247cff,#0752c9);
  font-size:20px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(36,124,255,.25);
}

.brand-title{
  font-size:15px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-sub{
  margin-top:4px;
  color:#6f7c90;
  font-size:8px;
  letter-spacing:2px;
}

.admin-badge{
  padding:8px 12px;
  border-radius:20px;
  background:rgba(240,185,77,.10);
  border:1px solid rgba(240,185,77,.25);
  color:#f0c66c;
  font-size:9px;
  font-weight:900;
}

/* LAYOUT */

.layout{
  display:flex;
  min-height:calc(100vh - 68px);
}

.sidebar{
  width:230px;
  flex:none;
  padding:20px 12px;
  border-right:1px solid rgba(255,255,255,.05);
  background:rgba(5,8,13,.55);
}

.nav-title{
  padding:8px 10px;
  color:#68768b;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.nav-btn{
  width:100%;
  margin-top:5px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:#8f9bae;
  text-align:left;
  font-size:10px;
  font-weight:800;
}

.nav-btn.active{
  color:#fff;
  background:rgba(36,124,255,.10);
  border-color:rgba(36,124,255,.18);
}

.nav-btn:hover{
  background:rgba(255,255,255,.035);
}

.main{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:25px 18px 80px;
}

/* HEADER */

.page-header{
  margin-bottom:22px;
}

.page-header h1{
  font-size:26px;
  font-weight:950;
}

.page-header p{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:25px;
}

.stat-card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:16px;
  background:linear-gradient(145deg,#101722,#080c13);
}

.stat-label{
  color:#758196;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.stat-value{
  margin-top:8px;
  font-size:24px;
  font-weight:950;
}

/* SECTION */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:13px;
}

.section-title h2{
  font-size:19px;
  font-weight:900;
}

.section-title p{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}

.refresh{
  border:1px solid rgba(36,124,255,.25);
  background:rgba(36,124,255,.10);
  color:#78b5ff;
  border-radius:10px;
  padding:9px 13px;
  font-size:10px;
  font-weight:900;
}

/* DEPOSITS */

.deposit-list{
  display:grid;
  gap:11px;
}

.deposit-card{
  padding:15px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  background:linear-gradient(145deg,#101722,#080c13);
}

.deposit-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.deposit-amount{
  font-size:21px;
  font-weight:950;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
}

.status.detected{
  color:#f0c66c;
  background:rgba(240,185,77,.10);
  border:1px solid rgba(240,185,77,.2);
}

.status.unmatched{
  color:#ffae62;
  background:rgba(255,159,67,.10);
  border:1px solid rgba(255,159,67,.2);
}

.status.ambiguous{
  color:#ff7180;
  background:rgba(255,83,100,.10);
  border:1px solid rgba(255,83,100,.2);
}

.deposit-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:13px;
}

.field{
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.04);
}

.field.full{
  grid-column:1/-1;
}

.label{
  color:#6f7c90;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.value{
  margin-top:4px;
  color:#e8eef8;
  font-size:10px;
  font-weight:700;
  word-break:break-word;
}

.tx{
  color:#65a8ff;
  text-decoration:underline;
}

.empty{
  padding:35px 20px;
  text-align:center;
  color:#758196;
  border:1px dashed rgba(255,255,255,.09);
  border-radius:16px;
  font-size:11px;
}

.error{
  padding:15px;
  border-radius:12px;
  color:#ff7180;
  background:rgba(255,83,100,.08);
  border:1px solid rgba(255,83,100,.18);
  font-size:10px;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:500px){

  .topbar{
    padding:0 12px;
  }

  .main{
    padding:20px 12px 70px;
  }

  .brand-sub{
    display:none;
  }

  .page-header h1{
    font-size:22px;
  }

  .stats{
    gap:8px;
  }

  .stat-card{
    padding:13px;
  }

  .stat-value{
    font-size:20px;
  }

  .deposit-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="logo">
      V
    </div>

    <div>
      <div class="brand-title">
        VALTRIX Global™
      </div>

      <div class="brand-sub">
        ADMINISTRATION
      </div>
    </div>

  </div>

  <div class="admin-badge">
    👑 ADMIN
  </div>

</header>


<div class="layout">

  <aside class="sidebar">

    <div class="nav-title">
      Administration
    </div>

    <button class="nav-btn active">
      💰
      Dépôts détectés
    </button>

    <button class="nav-btn">
      ⏳
      Dépôts en attente
    </button>

    <button class="nav-btn">
      👥
      Utilisateurs
    </button>

    <button class="nav-btn">
      💸
      Retraits
    </button>

    <button class="nav-btn">
      🤝
      Parrainages
    </button>

    <button class="nav-btn">
      📋
      Historique
    </button>

  </aside>


  <main class="main">

    <div class="page-header">

      <h1>
        Tableau de bord Admin
      </h1>

      <p>
        Gestion et vérification des opérations VALTRIX Global
      </p>

    </div>


    <div class="stats">

      <div class="stat-card">
        <div class="stat-label">
          Dépôts détectés
        </div>

        <div class="stat-value" id="totalDeposits">
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          USDT détectés
        </div>

        <div class="stat-value" id="totalUsdt">
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          Non attribués
        </div>

        <div class="stat-value" id="totalUnmatched">
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          Ambigus
        </div>

        <div class="stat-value" id="totalAmbiguous">
          0
        </div>
      </div>

    </div>


    <section>

      <div class="section-title">

        <div>
          <h2>
            💰 Dépôts détectés
          </h2>

          <p>
            Transactions USDT BEP20 nécessitant une vérification
          </p>
        </div>

        <button
          class="refresh"
          id="refreshDeposits">
          ↻ Actualiser
        </button>

      </div>


      <div
        id="depositList"
        class="deposit-list">

        <div class="empty">
          Chargement des dépôts...
        </div>

      </div>

    </section>

  </main>

</div>


<script>

/* =====================================================
   CONFIGURATION SUPABASE
===================================================== */

const SUPABASE_URL =
  'https://rokpuhcfetfwyozkcinr.supabase.co';

/*
  IMPORTANT :
  Utilise uniquement la clé ANON/PUBLISHABLE.
  JAMAIS la service_role dans le frontend.
*/

const SUPABASE_ANON_KEY =
  'sb_publishable_A7LXLgFE0b9UrFMOHX6LRw_D2PhFRrN';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   OUTILS
===================================================== */

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function formatDate(value){

  if(!value) return '—';

  const d = new Date(value);

  if(Number.isNaN(d.getTime()))
    return value;

  return d.toLocaleString('fr-FR');

}


function shortenHash(hash){

  if(!hash) return '—';

  if(hash.length <= 20)
    return hash;

  return hash.slice(0,10)
    + '...'
    + hash.slice(-8);

}


function statusLabel(status){

  if(status === 'detected')
    return 'Détecté';

  if(status === 'unmatched')
    return 'Non attribué';

  if(status === 'ambiguous')
    return 'Ambigu';

  return status || 'Détecté';

}


/* =====================================================
   CHARGEMENT DES DÉPÔTS
===================================================== */

async function loadDeposits(){

  const list =
    document.getElementById('depositList');

  list.innerHTML = `
    <div class="empty">
      Chargement...
    </div>
  `;


  try{

    const {
      data,
      error
    } = await supabaseClient
      .from('deposit_events')
      .select(`
        id,
        tx_hash,
        block_number,
        asset,
        network,
        chain_id,
        deposit_address,
        from_address,
        amount,
        confirmations,
        user_id,
        intent_id,
        status,
        reason,
        created_at,
        updated_at
      `)
      .in('status',[
        'detected',
        'unmatched',
        'ambiguous'
      ])
      .order(
        'created_at',
        {
          ascending:false
        }
      )
      .limit(100);


    if(error)
      throw error;


    updateStats(data || []);

    renderDeposits(data || []);


  }catch(error){

    console.error(
      'Erreur dépôts Admin:',
      error
    );


    list.innerHTML = `
      <div class="error">
        Impossible de charger les dépôts.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* =====================================================
   STATISTIQUES
===================================================== */

function updateStats(deposits){

  document.getElementById(
    'totalDeposits'
  ).textContent = deposits.length;


  const total =
    deposits.reduce(
      (sum,item) =>
        sum + Number(item.amount || 0),
      0
    );


  document.getElementById(
    'totalUsdt'
  ).textContent =
    total.toLocaleString(
      'fr-FR',
      {
        maximumFractionDigits:6
      }
    );


  document.getElementById(
    'totalUnmatched'
  ).textContent =
    deposits.filter(
      x => x.status === 'unmatched'
    ).length;


  document.getElementById(
    'totalAmbiguous'
  ).textContent =
    deposits.filter(
      x => x.status === 'ambiguous'
    ).length;

}


/* =====================================================
   AFFICHAGE
===================================================== */

function renderDeposits(deposits){

  const list =
    document.getElementById('depositList');


  if(!deposits.length){

    list.innerHTML = `
      <div class="empty">
        Aucun dépôt détecté pour le moment.
      </div>
    `;

    return;

  }


  list.innerHTML =
    deposits.map(item => {

      const tx =
        item.tx_hash || '';


      const txLink =
        tx
          ? `https://bscscan.com/tx/${encodeURIComponent(tx)}`
          : '#';


      const status =
        item.status || 'detected';


      return `

        <article class="deposit-card">

          <div class="deposit-top">

            <div class="deposit-amount">
              ${escapeHTML(item.amount)}
              USDT
            </div>

            <div class="status ${escapeHTML(status)}">
              ${statusLabel(status)}
            </div>

          </div>


          <div class="deposit-grid">

            <div class="field">

              <div class="label">
                Asset
              </div>

              <div class="value">
                ${escapeHTML(item.asset || 'USDT')}
              </div>

            </div>


            <div class="field">

              <div class="label">
                Réseau
              </div>

              <div class="value">
                ${escapeHTML(item.network || 'BEP20')}
              </div>

            </div>


            <div class="field">

              <div class="label">
                Confirmations
              </div>

              <div class="value">
                ${escapeHTML(item.confirmations ?? 0)}
              </div>

            </div>


            <div class="field">

              <div class="label">
                Bloc
              </div>

              <div class="value">
                ${escapeHTML(item.block_number ?? '—')}
              </div>

            </div>


            <div class="field">

              <div class="label">
                Utilisateur
              </div>

              <div class="value">
                ${
                  item.user_id
                    ? escapeHTML(item.user_id)
                    : 'Non attribué'
                }
              </div>

            </div>


            <div class="field">

              <div class="label">
                Intent
              </div>

              <div class="value">
                ${
                  item.intent_id
                    ? escapeHTML(item.intent_id)
                    : '—'
                }
              </div>

            </div>


            <div class="field full">

              <div class="label">
                Transaction BSC
              </div>

              <div class="value">

                ${
                  tx
                    ? `
                      <a
                        class="tx"
                        href="${txLink}"
                        target="_blank"
                        rel="noopener noreferrer">

                        ${escapeHTML(
                          shortenHash(tx)
                        )}

                      </a>
                    `
                    : '—'
                }

              </div>

            </div>


            <div class="field full">

              <div class="label">
                Adresse maître
              </div>

              <div class="value">
                ${escapeHTML(
                  item.deposit_address ||
                  '0x6eAb411039665f4283dd765274837A0eDEA76C25'
                )}
              </div>

            </div>


            <div class="field full">

              <div class="label">
                Adresse expéditeur
              </div>

              <div class="value">
                ${escapeHTML(
                  item.from_address || '—'
                )}
              </div>

            </div>


            <div class="field full">

              <div class="label">
                Date de détection
              </div>

              <div class="value">
                ${formatDate(
                  item.created_at
                )}
              </div>

            </div>


            ${
              item.reason
                ? `
                  <div class="field full">

                    <div class="label">
                      Motif
                    </div>

                    <div class="value">
                      ${escapeHTML(
                        item.reason
                      )}
                    </div>

                  </div>
                `
                : ''
            }

          </div>

        </article>

      `;

    }).join('');

}


/* =====================================================
   ACTUALISATION
===================================================== */

document
  .getElementById('refreshDeposits')
  .addEventListener(
    'click',
    loadDeposits
  );


loadDeposits();


/*
  Actualisation toutes les 30 secondes.
  Lecture uniquement.
*/

setInterval(
  loadDeposits,
  30000
);

</script>

</body>
</html>
