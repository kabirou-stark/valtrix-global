<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — VALTRIX Global™</title>
  <meta
    name="description"
    content="Connexion à votre espace VALTRIX Global™"
  >
  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --black: #000000;
      --blue: #0066ff;
      --blue-2: #1683ff;
      --blue-dark: #003cff;
      --white: #ffffff;
      --gray: #8d99aa;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(0, 102, 255, 0.20),
          transparent 35%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(0, 60, 255, 0.10),
          transparent 35%
        ),
        #000000;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    .container {
      width: 100%;
      max-width: 460px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      font-size: 20px;
      font-weight: 800;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-dark)
        );
      box-shadow:
        0 0 30px rgba(0, 102, 255, 0.45);
      font-size: 21px;
      font-weight: 900;
    }
    .global {
      color: var(--blue-2);
      margin-left: 3px;
    }
    .card {
      padding: 35px;
      border-radius: 22px;
      background:
        linear-gradient(
          145deg,
          rgba(9, 15, 25, 0.97),
          rgba(2, 4, 8, 0.97)
        );
      border:
        1px solid rgba(0, 102, 255, 0.20);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.50);
    }
    .card-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .card-header h1 {
      font-size: 30px;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }
    .card-header p {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      color: #b9c2cf;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.035);
      color: white;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }
    input::placeholder {
      color: #566173;
    }
    input:focus {
      border-color: rgba(0, 102, 255, 0.65);
      box-shadow:
        0 0 0 3px rgba(0, 102, 255, 0.08);
    }
    .forgot {
      display: block;
      text-align: right;
      margin-top: -7px;
      margin-bottom: 20px;
      color: var(--blue-2);
      font-size: 11px;
      cursor: pointer;
    }
    .forgot:hover {
      text-decoration: underline;
    }
    .button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-dark)
        );
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow:
        0 12px 35px rgba(0, 102, 255, 0.25);
      transition: 0.3s;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 17px 45px rgba(0, 102, 255, 0.40);
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
    #message.success {
      display: block;
      color: #75b7ff;
      background:
        rgba(0, 102, 255, 0.08);
      border:
        1px solid rgba(0, 102, 255, 0.20);
    }
    #message.error {
      display: block;
      color: #ff8d8d;
      background:
        rgba(255, 50, 50, 0.07);
      border:
        1px solid rgba(255, 50, 50, 0.15);
    }
    .register {
      text-align: center;
      margin-top: 25px;
      color: #6e7a8c;
      font-size: 12px;
    }
    .register a {
      color: var(--blue-2);
      font-weight: 700;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #687588;
      font-size: 11px;
    }
    .back:hover {
      color: white;
    }
    @media (max-width: 500px) {
      body {
        padding: 18px;
      }
      .card {
        padding: 25px 20px;
      }
      .card-header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGO -->
    <div class="logo">
      <div class="logo-icon">
        V
      </div>
      <div>
        VALTRIX
        <span class="global">GLOBAL™</span>
      </div>
    </div>
    <!-- CARD -->
    <div class="card">
      <div class="card-header">
        <h1>Bon retour.</h1>
        <p>
          Connectez-vous à votre espace
          personnel VALTRIX Global™.
        </p>
      </div>
      <!-- FORMULAIRE -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email">
            Adresse e-mail
          </label>
          <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            required
            autocomplete="email"
          >
        </div>
        <div class="form-group">
          <label for="password">
            Mot de passe
          </label>
          <input
            type="password"
            id="password"
            placeholder="Votre mot de passe"
            required
            autocomplete="current-password"
          >
        </div>
        <a
          href="#"
          class="forgot"
          id="forgotPassword"
        >
          Mot de passe oublié ?
        </a>
        <button
          type="submit"
          class="button"
          id="loginButton"
        >
          Se connecter →
        </button>
      </form>
      <!-- MESSAGE -->
      <div id="message"></div>
      <!-- INSCRIPTION -->
      <div class="register">
        Vous n'avez pas encore de compte ?
        <a href="./register.html">
          Créer un compte
        </a>
      </div>
    </div>
    <!-- RETOUR -->
    <a
      href="./index.html"
      class="back"
    >
      ← Retour à VALTRIX Global
    </a>
  </div>
  <!-- =========================
       SUPABASE
  ========================= -->
  <script>
    const SUPABASE_URL =
      "https://lgbyjqhcdsqpvkexxfmz.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_KfMHwxzqrYgXNWTkEqJu6g_6iIp9VL3";
    /* Vérification du chargement Supabase */
    if (!window.supabase) {
      console.error(
        "Supabase n'a pas été chargé."
      );
      document.getElementById(
        "message"
      ).textContent =
        "Erreur de chargement du service. Veuillez actualiser la page.";
      document.getElementById(
        "message"
      ).className = "error";
    }
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );
    const loginForm =
      document.getElementById("loginForm");
    const loginButton =
      document.getElementById("loginButton");
    const message =
      document.getElementById("message");
    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }
    /* =========================
       CONNEXION
    ========================= */
    loginForm.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();
        const email =
          document
            .getElementById("email")
            .value
            .trim();
        const password =
          document
            .getElementById("password")
            .value;
        loginButton.disabled = true;
        loginButton.textContent =
          "Connexion...";
        showMessage("", "");
        try {
          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });
          if (error) {
            console.error(
              "Erreur Supabase:",
              error
            );
            showMessage(
              "Impossible de se connecter. Vérifiez votre adresse e-mail et votre mot de passe.",
              "error"
            );
            loginButton.disabled = false;
            loginButton.textContent =
              "Se connecter →";
            return;
          }
          console.log(
            "Utilisateur connecté:",
            data.user
          );
          showMessage(
            "Connexion réussie. Ouverture de votre espace...",
            "success"
          );
          setTimeout(function() {
            window.location.href =
              "./dashboard.html";
          }, 800);
        }
        catch (error) {
          console.error(
            "Erreur:",
            error
          );
          showMessage(
            "Une erreur est survenue. Vérifiez votre connexion Internet.",
            "error"
          );
          loginButton.disabled = false;
          loginButton.textContent =
            "Se connecter →";
        }
      }
    );
    /* =========================
       MOT DE PASSE OUBLIÉ
    ========================= */
    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        async function(event) {
          event.preventDefault();
          const email =
            document
              .getElementById("email")
              .value
              .trim();
          if (!email) {
            showMessage(
              "Entrez d'abord votre adresse e-mail.",
              "error"
            );
            return;
          }
          showMessage(
            "Envoi du lien de récupération...",
            "success"
          );
          try {
            const {
              error
            } =
              await supabaseClient.auth
                .resetPasswordForEmail(
                  email,
                  {
                    redirectTo:
                      "https://kabirou-stark.github.io/valtrix-global/login.html"
                  }
                );
            if (error) {
              console.error(
                "Erreur récupération:",
                error
              );
              showMessage(
                "Impossible d'envoyer le lien de récupération.",
                "error"
              );
              return;
            }
            showMessage(
              "Un lien de récupération a été envoyé à votre adresse e-mail.",
              "success"
            );
          }
          catch (error) {
            console.error(
              "Erreur:",
              error
            );
            showMessage(
              "Une erreur est survenue. Réessayez.",
              "error"
            );
          }
        }
      );
  </script>
</body>
</html>
